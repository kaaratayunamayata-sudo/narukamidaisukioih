<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<title>ブロパス配布 第1回 陣取り争奪戦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='18' fill='%23ffc21a' stroke='%23140a2e' stroke-width='8'/%3E%3Cpath d='M30 52l14 14 28-30' fill='none' stroke='%23140a2e' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="board">
<div id="bg"></div>
<div id="offline" hidden>通信が不安定です。再接続しています…</div>
<div id="toasts"></div>

<!-- ============ ログイン（アカウント選択） ============ -->
<section id="screen-login">
  <div class="hero">
    <div class="hero-badge">FIRST EVENT</div>
    <h1 class="logo"><span>ブロパス配布</span><b>第1回 陣取り争奪戦</b></h1>
    <p class="hero-sub">巨大なブロパスの的から、自分の陣地を奪い取れ！</p>
  </div>
  <div class="card login-card">
    <h2 class="h2">自分のアカウントを選択してください</h2>
    <input id="search" class="input" type="search" placeholder="🔍 アカウント名で検索" autocomplete="off">
    <div id="loginList" class="login-list"></div>
    <div class="login-foot">
      <button class="btn ghost" id="btnSpectate">👀 ログインせず観戦だけする</button>
    </div>
  </div>
  <div class="foot"><a href="#" id="adminLink1">運営ログイン</a></div>
</section>

<!-- ============ メイン ============ -->
<section id="screen-app" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✔</span><span class="brand-text">ブロパス陣取り争奪戦</span></div>
    <div id="eventPill" class="pill"></div>
    <div class="top-right">
      <div id="meChip" class="me-chip"></div>
      <button class="icon-btn" id="btnChatTop" title="チャット">💬<i id="chatBadgeTop" class="badge" hidden>0</i></button>
      <button class="icon-btn" id="btnLogout" title="ログアウト">⏏</button>
    </div>
  </header>

  <main class="layout">
    <div class="col-board">
      <div id="banner" class="banner" hidden></div>
      <div class="board-wrap">
        <div class="board-frame">
          <div class="board-title">BROPASS ARENA</div>
          <div id="board" class="board"></div>
        </div>
        <div class="legend">
          <span><i class="lg free"></i>空き</span>
          <span><i class="lg own"></i>確保済み</span>
          <span><i class="lg fight"></i>争奪中</span>
          <span><i class="lg mine"></i>あなた</span>
        </div>
      </div>
    </div>

    <aside class="col-side">
      <div class="side-tabs" id="sideTabs">
        <button data-pane="stats">状況</button>
        <button data-pane="live">LIVE</button>
        <button data-pane="players">参加者</button>
      </div>
      <div class="pane" data-pane="stats"><div id="paneStats"></div></div>
      <div class="pane" data-pane="live"><div id="paneLive"></div></div>
      <div class="pane" data-pane="players"><div id="panePlayers"></div></div>
      <div class="foot"><a href="#" id="adminLink2">運営ログイン</a></div>
    </aside>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-tab="board"><span>🎯</span>的</button>
    <button data-tab="live"><span>🔴</span>LIVE<i id="liveBadge" class="badge" hidden>0</i></button>
    <button data-tab="players"><span>🏆</span>参加者</button>
    <button data-tab="stats"><span>📊</span>状況</button>
  </nav>
</section>

<!-- ============ チャット ============ -->
<button id="chatFab" class="chat-fab" hidden>💬<i id="chatBadge" class="badge" hidden>0</i></button>
<aside id="chat" class="chat" hidden>
  <div class="chat-head">
    <div><b>みんなのチャット</b><small id="chatOnline"></small></div>
    <button class="icon-btn dark" id="chatClose">✕</button>
  </div>
  <div id="chatList" class="chat-list"></div>
  <form id="chatForm" class="chat-form">
    <input id="chatInput" class="input" maxlength="200" placeholder="メッセージを入力…" autocomplete="off">
    <button class="btn small" type="submit">送信</button>
  </form>
</aside>

<!-- ============ モーダル / 対戦 / 管理 ============ -->
<div id="modal" class="overlay" hidden><div class="modal card" id="modalBody"></div></div>
<div id="battle" class="overlay battle-overlay" hidden><div id="battleBody"></div></div>
<div id="admin" class="overlay admin-overlay" hidden><div id="adminBody" class="admin card"></div></div>

<script src="app.js"></script>
</body>
</html>
