 if(t!=null&&t>=0&&i>=0){if(t>=T0+i*.5)return['FINISHED','gold'];return online(p)?['RACING','blue']:['OFFLINE','gray']}
 return online(p)?['ONLINE','green']:['OFFLINE','gray']}

async function sync(){const a=Date.now(),{data}=await sb.rpc('now_ms');if(data!=null)off=Number(data)-(a+Date.now())/2}

 P=j.players;R=j.race;CH=j.chat;PR={};j.presence.forEach(x=>PR[x.name]=ms(x.last_seen));onData()}
function onData(){rebuild();renderSel();renderHud();renderChat();renderAdmin()}

/* ---------- 参加者選択 ---------- */
let ssig='';function renderSel(){if(entered)return;const q_=P.map(p=>p.name+stat(p)[0]).join()+ruleText();if(q_===ssig)return;ssig=q_;$('#rule').textContent=ruleText();const box=$('#cards');box.textContent='';

  const r=el('div');r.append(el('span','chip '+c,s),' ',el('span','',online(p)?'参加中':'未参加'));
  d.append(n,r);d.onclick=()=>!p.banned&&pick(p.name);box.append(d)})}
async function pick(n){const{data}=await sb.rpc('claim_player',{p_name:n,p_token:tok});
 if(data==='ok'){me=n;sessionStorage.me=n;enter()}else alert({taken:'このアカウントは他の人が使用中です',banned:'このアカウントはBANされています'}[data]||'参加できませんでした')}

$('#spec').onclick=()=>{me='';sessionStorage.removeItem('me');enter()};

 if(data===false){sessionStorage.removeItem('me');alert('接続が解除されました');location.reload()}},8000);
addEventListener('pagehide',()=>{if(me)navigator.sendBeacon(API,JSON.stringify({op:'release_player',p_name:me,p_token:tok}))});

 $('#meta').textContent=`ONLINE ${P.filter(online).length} / ${act.length}`;$('#onl').textContent=`オンライン ${P.filter(online).length}人`;
 $('#stat').textContent={waiting:'待機中',racing:'RACE LIVE',paused:'一時停止中',aborted:'レース中止'}[R.status]||'';
 const a=$('#ann');a.classList.toggle('hidden',!R.announce);a.textContent='📢 '+R.announce;
 const w=$('#wait');w.classList.toggle('hidden',t!=null);
 if(t==null){w.textContent='';w.append(el('h2','',R.status==='aborted'?'レースは中止されました':'レース開始をお待ちください'),
  el('p','',`参加者 ${act.length}人 ／ オンライン ${P.filter(online).length}人`),el('p','note',ruleText()),
  el('p','',R.status==='aborted'?'管理者の再開準備をお待ちください。':'管理者が開始ボタンを押すと、全員の画面で同時にレースが始まります。'));
  const l=el('div');act.filter(online).forEach(p=>{const s=el('span','chip green',p.name);s.style.margin='2px';l.append(s)});w.append(l)}
 $('#ci').disabled=!me;$('#ci').placeholder=me?'メッセージ':'参加者のみ投稿できます'}
let csig='';
function renderChat(){const sig=CH.map(c=>c.id+(c.deleted?'x':'')).join();if(sig===csig)return;csig=sig;const m=$('#msgs');
 const near=m.scrollHeight-m.scrollTop-m.clientHeight<60;m.textContent='';
 CH.filter(c=>!c.deleted).forEach(c=>{const d=el('div',c.name.startsWith('📢')?'ad':'');
  d.textContent=`[${new Date(c.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}] ${c.name}：${c.msg}`;m.append(d)});
 if(near||!m.dataset.i){m.scrollTop=m.scrollHeight;m.dataset.i=1}}
async function say_(){const v=$('#ci').value.trim();if(!v||!me)return;$('#ci').value='';
 const{data}=await sb.rpc('send_chat',{p_name:me,p_token:tok,p_msg:v});if(data==='rate')alert('連続投稿はできません。少し待ってください');load()}
$('#cs').onclick=say_;$('#ci').onkeydown=e=>{if(e.key==='Enter')say_()};

/* ---------- 3D ---------- */
const cv=$('#c'),rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050a1c);scene.fog=new THREE.Fog(0x050a1c,150,900);
const cam=new THREE.PerspectiveCamera(60,1,.1,2500);
function rs(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();const f=$('#fx');f.width=innerWidth;f.height=innerHeight}
addEventListener('resize',rs);rs();
scene.add(new THREE.AmbientLight(0x7a92d8,.8));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(100,300,100);scene.add(dl);
const pl=new THREE.PointLight(0xffe0a0,1.4,70);scene.add(pl);
{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<900;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(1200);a.push(v.x,v.y,v.z)}
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));window.stars=new THREE.Points(g,new THREE.PointsMaterial({color:0x9db8ff,size:3,fog:false}));scene.add(stars)}
// コース（タートル方式：[旋回角, 長さ, 落差]）螺旋→ジグザグ→急降下→S字→逆螺旋→ゴール手前の長い坂
const segs=[[0,30,3],[720,260,40],[-120,45,5],[120,45,5],[-120,45,5],[120,45,5],[0,40,22],[180,80,8],[-180,80,8],[-540,200,25],[0,90,12],[0,40,0]];
const pts=[new THREE.Vector3(0,80,0)];{let x=0,y=80,z=0,h=0;segs.forEach(([tn,len,dr])=>{const n=Math.ceil(len/7);for(let i=0;i<n;i++){h+=tn/n*Math.PI/180;x+=Math.sin(h)*len/n;z+=Math.cos(h)*len/n;y-=dr/n;pts.push(new THREE.Vector3(x,y,z))}})}
const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal'),L=curve.getLength(),S0=18/L,SG=1-36/L;
const V=new THREE.Vector3(),TG=new THREE.Vector3(),SD=new THREE.Vector3(),UP=new THREE.Vector3(),G=new THREE.Vector3(),Y=new THREE.Vector3(0,1,0);
function frame(s){curve.getPointAt(s,V);curve.getTangentAt(s,TG);SD.crossVectors(TG,Y).normalize();UP.crossVectors(SD,TG).normalize()}
{const tg=new THREE.TubeGeometry(curve,700,2.6,14,false);
 scene.add(new THREE.Mesh(tg,new THREE.MeshPhysicalMaterial({color:0x7fb2ff,transparent:true,opacity:.14,roughness:.05,side:THREE.DoubleSide,depthWrite:false})));
 scene.add(new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:0x4d7bff,wireframe:true,transparent:true,opacity:.16})));
 const N=500,pos=[],idx=[],e1=[],e2=[];for(let i=0;i<=N;i++){frame(i/N);[-1.7,1.7].forEach((w,j)=>{const q=V.clone().addScaledVector(SD,w).addScaledVector(UP,-2);pos.push(q.x,q.y,q.z);(j?e2:e1).push(q)})}
 for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 scene.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x1b2f66,emissive:0x0a1a44,side:THREE.DoubleSide,roughness:.4})));
 [e1,e2].forEach(e=>scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(e),new THREE.LineBasicMaterial({color:0xf5c451}))))}
frame(SG);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.7,.18,10,40),new THREE.MeshStandardMaterial({color:0xffd96b,emissive:0xf5a623,emissiveIntensity:1.2}));
ring.position.copy(V);ring.lookAt(V.clone().add(TG));scene.add(ring);
frame(S0);const gate=new THREE.Mesh(new THREE.BoxGeometry(5.4,4.4,.3),new THREE.MeshStandardMaterial({color:0xff3b3b,emissive:0xaa0000,transparent:true,opacity:.55}));
gate.position.copy(V).addScaledVector(TG,.5);gate.lookAt(V.clone().add(TG));scene.add(gate);
const bb=new THREE.Box3().setFromPoints(pts),ctr=bb.getCenter(new THREE.Vector3()),sz=bb.getSize(new THREE.Vector3()),orb=Math.max(sz.x,sz.z)*1.1+90;

const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hash=n=>[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7),sg=new THREE.SphereGeometry(.42,24,16);
let M=[],mkey='';
function label(n,own){const c=document.createElement('canvas');c.width=256;c.height=48;const x=c.getContext('2d');x.font='bold 26px sans-serif';x.textAlign='center';
 x.lineWidth=5;x.strokeStyle='#000';x.fillStyle=own?'#ffd96b':'#fff';x.strokeText(n,128,34);x.fillText(n,128,34);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));s.scale.set(own?8:5.6,own?1.5:1.05,1);s.renderOrder=9;return s}
function rebuild(){const live=['racing','paused'].includes(R.status)&&R.results.length;
 const names=live?R.results:P.filter(p=>!p.banned).map(p=>p.name),key=(live?'L':'W')+R.seed+'|'+names.join('|');if(key===mkey)return;mkey=key;
 M.forEach(m=>{scene.remove(m.mesh);scene.remove(m.sp)});resetFlags();
 M=names.map((n,i)=>{const p=P.find(x=>x.name===n)||{sort:i},c=new THREE.Color(hue(p)),r=rng(R.seed+hash(n)),k=3+Math.floor(r()*5);
  const mesh=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.45,metalness:.2,roughness:.15})),sp=label(n,n===me);
  scene.add(mesh,sp);return{n,i,mesh,sp,k,a:(.35+.55*r())/(6.2832*k),ph:r()*6.28,lane:(r()-.5)*3,f:.5+r(),T:T0+i*.5,s:S0,done:false,css:hue(p)}})}
function place(m,t){frame(S0);const row=Math.floor(m.i/5),col=m.i%5;
 G.copy(V).addScaledVector(TG,-(row*1.05+.6)).addScaledVector(SD,(col-2)*.75).addScaledVector(UP,-1.55);
 if(t==null||t<=0){m.s=S0;m.mesh.position.copy(G);m.sp.position.copy(G).y+=1.3;return}
 const u=Math.min(1,t/m.T);let sf=u+m.a*Math.sin(Math.PI*u)*Math.sin(6.2832*m.k*u+m.ph);sf=Math.min(1,Math.max(0,sf));
 const fin=t-m.T;m.s=fin>=0?SG:S0+(SG-S0)*sf;frame(m.s);
 let lat=Math.max(-1.6,Math.min(1.6,m.lane*.55+.5*Math.sin(t*.6*m.f+m.ph)));
 if(fin>0){const w=Math.min(1,fin);lat=lat*(1-w)+((m.i%5)-2)*.7*w}
 V.addScaledVector(SD,lat).addScaledVector(UP,-1.55+.1*Math.abs(Math.sin(t*5*m.f+m.ph)));
 if(fin>0)V.addScaledVector(TG,Math.min(1,fin)*(2.5+(m.i%6)*1.1));
 if(t<2){const w=t/2;G.lerp(V,w*w*(3-2*w));m.mesh.position.copy(G)}else m.mesh.position.copy(V);
 m.sp.position.copy(m.mesh.position).y+=1.3}

let ac;function beep(f,d=.15,v=.15){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let lastCount=99,lastLead='',castT=0,lastMsg='',fired={},finalOn=false,finalHid=false,bigS='',PT=[],fxT=0;
function resetFlags(){lastCount=99;lastLead='';fired={};finalOn=false;finalHid=false;$('#goals').textContent='';$('#final').classList.add('hidden')}
function big(s){if(s!==bigS){bigS=s;$('#big').textContent=s}}
function say(s){if(s===lastMsg)return;lastMsg=s;const c=$('#cast');c.classList.remove('hidden');c.textContent='🎙 '+s}
function chatter(o,t){const a=o[0],b=o[1],rem=Math.ceil(LIMIT-t);
 const L=[`現在トップを走るのは${a.n}！`,`${a.n}が先頭をキープ！`,`第2集団が接近しています！`,`${b.n}が${a.n}に迫る！`,`おっと！ここで大きく順位が入れ替わった！`,`これは最後まで分かりません！`,
  `コース上は大混戦！`,`ビー玉同士が激しく接触！`,`ジャンプ台で大きく跳ねた！`,`狭い通路で渋滞発生！`,`後方からの追い上げが始まった！`,`誰が勝つのか全く読めない！`,`急降下区間で一気にスピードアップ！`];
 for(const x of[120,60,30,10])if(rem<=x&&!fired[x]){fired[x]=1;return say(`ゴールまで残り${x}秒！`)}
 say(L[Math.floor(Math.random()*L.length)])}
function goal(m){const g=el('div','',`🏁 ${m.i+1}位 ${m.n}`);$('#goals').prepend(g);while($('#goals').children.length>5)$('#goals').lastChild.remove();beep(m.i?700:1000,.25);
 if(!m.i){big('🏁 '+m.n);setTimeout(()=>{bigS=''},3500)}}
function hudTick(t,o){$('#timer').textContent=(m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0'))(Math.ceil(Math.max(0,LIMIT-Math.max(0,t??0))));
 const b=$('#board');b.textContent='';if(t==null||!o.length)return;
 o.slice(0,8).concat(M.includes(o.find(x=>x.n===me))&&o.indexOf(o.find(x=>x.n===me))>=8?[o.find(x=>x.n===me)]:[]).forEach(m=>{
  const r=el('div','row'+(m.n===me?' me':'')),d=el('span','dot');d.style.background=d.style.color=m.css;
  r.append(el('b','',o.indexOf(m)+1),d,el('span','n',m.n),el('span','',t>=m.T?'FIN':Math.round((m.s-S0)/(SG-S0)*100)+'%'));b.append(r)});
 if(M.length>1&&t>3&&t<M[M.length-1].T){if(lastLead&&o[0].n!==lastLead)say(`おっと！${o[0].n}がトップに躍り出た！`);if(t>castT){castT=t+3.5+Math.random()*2.5;chatter(o,t)}}
 lastLead=o[0].n}
function showFinal(){finalOn=true;const f=$('#final');f.textContent='';f.classList.remove('hidden');
 f.append(el('div','',''),el('h2','t','WE HAVE A WINNER!!'),el('div','w',R.results[0]),el('h2','t','CONGRATULATIONS！'),el('p','note',ruleText()));
 const tb=el('table');R.results.forEach((n,i)=>{const r=el('tr');r.append(el('td','',i+1),el('td','',n));if(n===me)r.style.background='rgba(245,196,81,.3)';tb.append(r)});f.append(tb);
 const c=el('button','b','閉じる');c.onclick=()=>{finalHid=true;f.classList.add('hidden');PT=[]};f.append(c)}
function fxRun(dt,on){const f=$('#fx'),c=f.getContext('2d');if(!on){if(PT.length){c.clearRect(0,0,f.width,f.height);PT=[]}return}
 fxT-=dt;if(fxT<=0){fxT=.6;const x=Math.random()*f.width,y=f.height*(.15+Math.random()*.35),h=Math.random()*360;for(let i=0;i<50;i++){const a=Math.random()*6.28,v=80+Math.random()*180;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.4,h,s:3})}}
 for(let i=0;i<4;i++)PT.push({x:Math.random()*f.width,y:-10,vx:(Math.random()-.5)*60,vy:100+Math.random()*120,l:6,h:Math.random()*360,s:6,c:1});
 c.clearRect(0,0,f.width,f.height);PT=PT.filter(p=>(p.l-=dt)>0&&p.y<f.height+20);
 PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.c)p.vy+=150*dt;c.fillStyle=`hsl(${p.h} 100% 60%)`;c.globalAlpha=Math.min(1,p.l);c.fillRect(p.x,p.y,p.s,p.c?p.s*1.6:p.s)})}

const look=new THREE.Vector3(),wp=new THREE.Vector3(),wl=new THREE.Vector3();let last=performance.now(),acc=0;
function tick(tm){requestAnimationFrame(tick);const dt=Math.min(.1,(tm-last)/1000);last=tm;const t=raceT();
 M.forEach(m=>place(m,t));stars.rotation.y+=dt*.01;ring.material.emissiveIntensity=1.2+Math.sin(tm/200)*.5;
 const o=[...M].sort((a,b)=>b.s-a.s||a.T-b.T),live=t!=null&&entered;
 if(t!=null&&t>=0)M.forEach(m=>{if(t>=m.T&&!m.done){m.done=true;goal(m)}});
 gate.visible=t==null||t<.3;gate.position.y-=0;
 $('#dim').classList.toggle('on',t!=null&&t<-3);
 if(live&&t<0){const c=Math.ceil(-t);
  if(t<-5)big('MARBLE GRAND PRIX');else if(t<-3.2)big(M.length+' MARBLES READY');else{big(String(c));if(c!==lastCount){lastCount=c;beep(660,.2)}}}
 else if(live&&t<1.6){big('GO!');if(lastCount!==0){lastCount=0;beep(1100,.6,.2)}}else if(live&&t>=1.6&&bigS==='GO!')big('');
 else if(t==null)big('');
 // カメラ
 if(o.length&&t!=null&&t>=0&&t<T0-4){const l=o[0];frame(l.s);wp.copy(l.mesh.position).addScaledVector(TG,-13).addScaledVector(UP,6.5);wl.copy(l.mesh.position).addScaledVector(TG,6)}
 else if(o.length&&t!=null&&t>=T0-4){frame(SG);wp.copy(V).addScaledVector(SD,9).addScaledVector(UP,4).addScaledVector(TG,-5);wl.copy(V).addScaledVector(TG,2)}
 else if(t!=null){frame(S0);wp.copy(V).addScaledVector(SD,14).addScaledVector(UP,6).addScaledVector(TG,-10+(t+9)*.6);wl.copy(V).addScaledVector(TG,-3)}
 else{const a=tm/12000;wp.set(ctr.x+Math.cos(a)*orb,ctr.y+sz.y*.9+40,ctr.z+Math.sin(a)*orb);wl.copy(ctr)}
 const k=t==null?1:1-Math.exp(-dt*3);cam.position.lerp(wp,k);look.lerp(wl,k);cam.lookAt(look);
 if(o.length){pl.position.copy(o[0].mesh.position).y+=4}
 acc+=dt;if(acc>.2){acc=0;if(live)hudTick(t,o);
  if(live&&M.length&&t>M[M.length-1].T+2.5&&!finalOn&&!finalHid)showFinal();
  if(t==null||t<0){if(finalOn){finalOn=false;$('#final').classList.add('hidden')}}}
 fxRun(dt,finalOn&&!finalHid);rd.render(scene,cam)}
requestAnimationFrame(tick);
